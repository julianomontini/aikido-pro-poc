# Boilerplate -- Render Blueprint for REQUIREMENTS.md's DAST prerequisite.
# At render.com: "New +" -> "Blueprint" -> point it at this repo. No secrets
# to fill in here; SECRET_KEY is generated by Render on first deploy.
services:
  - type: web
    name: aikido-pro-poc
    env: python
    plan: free
    buildCommand: pip install poetry==1.8.3 && poetry config virtualenvs.create false && poetry install --only main --no-root
    startCommand: gunicorn -b 0.0.0.0:$PORT app.main:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
